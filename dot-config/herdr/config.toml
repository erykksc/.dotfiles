onboarding = false

[terminal]
new_cwd = "follow"

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "terminal"

[keys]
# Compatibility spelling: 0.9.1 servers require a scalar prefix;
# 0.9.3 clients also recognize extra_prefixes. Both enter the same mode.
prefix = "ctrl+b"
extra_prefixes = ["ctrl+space"]
split_vertical = ["prefix+v", "prefix+%"]
split_horizontal = ['prefix+minus', 'prefix+"']
rename_tab = ["prefix+shift+t", "prefix+comma"]
detach = ["prefix+q", "prefix+d"]
close_tab = ["prefix+shift+x", "prefix+ampersand"]
new_tab = ["prefix+c", "ctrl+shift+t"]
# Herdr 0.9.3 lacks PageUp/PageDown names; kitty forwards those four
# physical shortcuts as these supported named chords.
previous_tab = ["prefix+p", "ctrl+alt+left"]
next_tab = ["prefix+n", "ctrl+alt+right"]
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_workspace = "ctrl+shift+k"
next_workspace = "ctrl+shift+j"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
move_tab_previous = "ctrl+alt+shift+left"
move_tab_next = "ctrl+alt+shift+right"
focus_pane_left = ["prefix+h", "prefix+left", "alt+h"]
focus_pane_down = ["prefix+j", "prefix+down", "alt+j"]
focus_pane_up = ["prefix+k", "prefix+up", "alt+k"]
focus_pane_right = ["prefix+l", "prefix+right", "alt+l"]
swap_pane_left = ["prefix+shift+h", "alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "alt+shift+l"]
close_pane = ["prefix+x", "ctrl+shift+w"]
new_worktree = "prefix+shift+g"
remove_worktree = "prefix+shift+backspace"

[keys.indexed]
workspaces = "ctrl"
agents = ""

[[keys.command]]
key = "alt+g"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-tab-launcher" lazygit'
description = "focus or create lazygit tab"

[[keys.command]]
key = "ctrl+shift+."
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-tab-launcher" dotfiles'
description = "open dotfiles in Neovim"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-generic-layout"'
description = "open generic project layout in current workspace"

[[keys.command]]
key = "prefix+!"
type = "popup"
command = 'bash "$HOME/.config/herdr/bin/herdr-move-pane"'
description = "move pane to a new or existing tab"
width = 60
height = 16

[theme]
name = "kanagawa"
auto_switch = false
